services:
  app:
    build:
      dockerfile: ./Dockerfile
    container_name: app-php
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - ./:/var/www/html

    # environment:
    #   # --- MySQL ---
    #   DB_HOST: "${DB_HOST:-db}"
    #   DB_PORT: "${DB_PORT:-3306}"
    #   DB_DATABASE: "${DB_DATABASE:-covoit}"
    #   DB_USERNAME: "${DB_USERNAME:-covoit}"
    #   DB_PASSWORD: "${DB_PASSWORD:-covoit}"

    #   # --- Mongo ---
    #   # Lit la valeur depuis .env ; par défaut pointe sur le conteneur mongo local
    #   MONGODB_URI: "${MONGODB_URI:-mongodb://mongo:27017}"
    #   MONGODB_DB:  "${MONGODB_DB:-covoit}"
    # depends_on:
    #   - db
    # si tu utilises Mongo local, tu peux aussi décommenter:
    #  - mongo

  db:
    image: mysql:8.3
    container_name: app-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-covoit}
      MYSQL_USER: ${DB_USERNAME:-covoit}
      MYSQL_PASSWORD: ${DB_PASSWORD:-covoit}
    volumes:
      - ./database:/docker-entrypoint-initdb.d 
    

