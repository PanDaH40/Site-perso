<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./asset/CSS/PageCovoiturage.css" />
    <title>Covoiturage</title>
  </head>
  <body>
    <div class="container py-5">
      <h1 class="text-center mb-4">🚗 Liste des trajets disponibles</h1>

      <nav class="mb-4">
        <a href="dashboard.html" class="btn bg-warning btn-sm m-2">Dashboard</a>
        <a href="Profile.html" class="btn bg-warning btn-sm m-2">Profil</a>
        <a href="PageDaccueil.html" class="btn bg-warning btn-sm m-2"
          >Accueil</a
        >
        <a href="PageDeContact.html" class="btn bg-warning btn-sm m-2"
          >Contact</a
        >
        <a href="dashboard.html" class="btn bg-warning btn-sm m-2">Message</a>
      </nav>

     <div id="formAjoutContainer" class="card p-4 mb-5">
  <h5 class="mb-3">Ajouter un trajet</h5>
  <form id="trajetForm">
    <div class="row mb-3">
      <div class="col">
        <input
          type="text"
          id="depart"
          class="form-control mb-1"
          placeholder="Départ (ville ou quartier)"
          required
        />
        <input
          type="text"
          id="depart_precis"
          class="form-control"
          placeholder="Précision du lieu de départ (adresse, point de RDV…)"
        />
        <small class="form-text text-muted">
          Ex : Gare de Dax <b>|</b> Précision : Parking côté ouest, devant le hall.
        </small>
      </div>
      <div class="col">
        <input
          type="text"
          id="arrivee"
          class="form-control mb-1"
          placeholder="Arrivée (ville ou quartier)"
          required
        />
        <input
          type="text"
          id="arrivee_precis"
          class="form-control"
          placeholder="Précision du lieu d’arrivée (adresse, arrêt, campus…)"
        />
        <small class="form-text text-muted">
          Ex : Pau Université <b>|</b> Précision : Arrêt de bus devant le RU Cap Sud.
        </small>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col">
        <input type="date" id="date" class="form-control" required />
      </div>
      <div class="col">
        <input type="time" id="heure" class="form-control" required />
      </div>
      <div class="col">
        <input
          type="number"
          id="places"
          class="form-control"
          min="1"
          placeholder="Places"
          required
        />
      </div>
      <div class="col">
        <input
          type="number"
          id="prix"
          class="form-control"
          min="0"
          step="0.01"
          placeholder="Prix (€)"
          required
        />
      </div>
    </div>
    <button type="submit" class="btn bg-warning w-100">Ajouter</button>
    <div class="text-end mt-2">
      <button type="reset" class="btn btn-outline-secondary btn-warning">
        Réinitialiser
      </button>
    </div>
  </form>
</div>

      <!-- Grille des trajets -->
      <div class="row" id="liste-trajets"></div>
    </div>

    <!-- Modal de réservation -->

    <div
      class="modal fade"
      id="reservationModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Réserver ce trajet</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div id="modalBody"></div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Annuler
            </button>
            <button
              type="button"
              class="btn btn-success"
              id="btnConfirmerReservation"
            >
              Confirmer
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./asset/JS/Covoiturage.js"></script>
  </body>
</html>
