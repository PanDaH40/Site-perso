<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Utilisateur</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./asset/CSS/Profile.css" />
  </head>

  <body>
    <header class="bg-light py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0">Mon Profil</h1>
        <div class="d-flex justify-content-end mb-2"></div>
      </div>

      <!-- Notification cloche -->
      <a href="Messagerie.html" id="notif-messages" class="position-relative m-3 d-inline-block">
        <i class="bi bi-bell fs-3"></i>
        <span id="badge-msg" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
      </a>
      
      <div class="d-flex justify-content-end gap-2 mb-2">
        <a href="PageDaccueil.html" class="btn btn-outline-warning btn-sm">
          <i class="bi bi-house-door"></i> Accueil
        </a>
        <button id="logoutBtn" class="btn btn-outline-warning btn-sm">
          Déconnexion
        </button>
      </div>

      <!-- Photo de profil -->
      <div class="mb-3 text-center">
        <label for="profileAvatar" class="form-label d-block">Photo de profil</label>
        <img
          id="avatarPreview"
          src=""
          alt="Avatar"
          class="avatar-preview mb-2"
          style="width: 120px; height: 120px; object-fit: cover; cursor: pointer; border-radius: 50%; border: 2px solid #ddd;"
        />
        <form id="avatarUploadForm" enctype="multipart/form-data" style="display: inline">
          <input
            type="file"
            id="profileAvatar"
            name="avatar"
            accept="image/*"
            style="display: none"
          />
          <input type="hidden" id="avatarUserId" name="user_id" value="" />
        </form>
        <div id="avatarUploadResult" class="mt-2"></div>
      </div>
    </header>

    <main class="container mt-4">
      <div class="row">
        <!-- Formulaire profil -->
        <div class="col-md-6">
          <h2>Mes Informations</h2>
          <form id="profileForm">
            <!-- Choix du rôle -->
            <fieldset class="mb-4">
              <legend>Je suis&nbsp;:</legend>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="roleConducteur"
                  name="roleConducteur"
                />
                <label class="form-check-label" for="roleConducteur">Conducteur</label>
              </div>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="rolePassager"
                  name="rolePassager"
                />
                <label class="form-check-label" for="rolePassager">Passager</label>
              </div>
            </fieldset>

            <div class="mb-3">
              <label for="profileBio" class="form-label">Présentation / À propos de moi</label>
              <textarea
                id="profileBio"
                name="bio"
                class="form-control"
                rows="3"
                placeholder="Parlez un peu de vous, vos centres d'intérêt, vos expériences..."
              ></textarea>
            </div>

            <div class="mb-3">
              <label for="profilePrenom" class="form-label">Prénom</label>
              <input type="text" id="profilePrenom" name="prenom" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="profileNom" class="form-label">Nom</label>
              <input type="text" id="profileNom" name="nom" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="profileEmail" class="form-label">Email</label>
              <input type="email" id="profileEmail" name="email" class="form-control" required />
            </div>

            <!-- Bloc Conducteur -->
            <div id="conducteurFields">
              <h3 class="mt-4">Mon véhicule</h3>
              <div class="mb-3">
                <label for="profileVoiture" class="form-label">Modèle de voiture</label>
                <input type="text" id="profileVoiture" name="voiture" class="form-control" />
              </div>
              <div class="mb-3">
                <label class="form-label">Type de carburant</label>
                <select id="profileCarburant" name="carburant" class="form-select">
                  <option value="electric">Électrique</option>
                  <option value="hybride">Hybride</option>
                  <option value="essence">Essence</option>
                  <option value="gazole">Gazole</option>
                </select>
              </div>
              <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="acceptAnimaux" name="animaux" />
                <label class="form-check-label" for="acceptAnimaux">Animaux acceptés</label>
              </div>
              <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" id="acceptFumeur" name="fumeurs" />
                <label class="form-check-label" for="acceptFumeur">Fumeur accepté</label>
              </div>
            </div>

            <!-- Bloc Passager -->
            <div id="passagerFields">
              <h3 class="mt-4">Mes préférences (Passager)</h3>
              <div class="mb-3">
                <label for="profilePreferences" class="form-label">Préférences</label>
                <textarea
                  id="profilePreferences"
                  name="preferences"
                  class="form-control"
                  rows="3"
                  placeholder="Ex: Non fumeur, Animaux interdits..."
                ></textarea>
              </div>
            </div>

            <button type="button" id="btnOpenChangePwdModal" class="btn btn bg-warning ">
            Changer le mot de passe
            </button>


            <button type="submit" class="btn btn bg-warning ">
              Enregistrer les modifications
            </button>
          </form>
        </div>
      </div>

      <!-- Modal Changement mot de passe -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form id="changePasswordForm" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="changePasswordModalLabel">Changer le mot de passe</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="currentPassword" class="form-label">Mot de passe actuel</label>
          <input type="password" class="form-control" id="currentPassword" name="currentPassword" required autocomplete="current-password" />
        </div>
        <div class="mb-3">
          <label for="newPasswordModal" class="form-label">Nouveau mot de passe</label>
          <input type="password" class="form-control" id="newPasswordModal" name="newPasswordModal" required autocomplete="new-password" />
        </div>
        <div class="mb-3">
          <label for="confirmNewPasswordModal" class="form-label">Confirmer le nouveau mot de passe</label>
          <input type="password" class="form-control" id="confirmNewPasswordModal" name="confirmNewPasswordModal" required autocomplete="new-password" />
        </div>
        <div id="modalErrorMsg" class="text-danger" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-primary">Valider</button>
      </div>
    </form>
  </div>
</div>


    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./asset/JS/Profile.js"></script>
    <script src="./asset/JS/logout.js"></script>
  </body>
</html>
