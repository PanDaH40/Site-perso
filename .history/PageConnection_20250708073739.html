<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page de Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./asset/CSS/PageConnection.css">

</head>
<body>

  <!-- Bandeau Titre -->
  <div class="parallax position-relative d-flex flex-column justify-content-center align-items-center text-white" style="height: 30vh;">
    <h1 class="titre text-center">EcoRide</h1>
  </div>

  <!-- Formulaire -->
  <div class="container d-flex align-items-center" style="height: 70vh;">
    <div class="row w-100 justify-content-center">
      <div class="col-md-4">
        <form id="loginForm" class="border p-4 bg-light shadow rounded">
          <div class="form-group mb-3">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Entrez votre email" required>
          </div>

          <div class="form-group mb-3">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Entrez votre mot de passe" required>
          </div>

          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="acceptTerms" required>
            <label class="form-check-label" for="acceptTerms">
              Veuillez accepter les termes et conditions
            </label>
          </div>

          <button type="submit" class="btn btn-success w-100 mb-3">Se connecter</button>

          <a href="PageInscription.html" class="btn btn-secondary w-100 mb-3">S'inscrire</a>
          <button type="button" class="btn btn-outline-secondary w-100" onclick="window.history.back();">Retour</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Ton JS -->
  <script src="./asset/JS/Connection.js"></script>
</body>
</html>
