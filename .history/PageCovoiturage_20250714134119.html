<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./asset/CSS/PageCovoiturage.css">
    <title>Covoiturage</title>
</head>
<body>

<div class="container py-5">
    <h1 class="text-center mb-4">🚗 Liste des trajets disponibles</h1>

    <!-- Bouton pour afficher le modal d'ajout -->
    <div class="text-center mb-3">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#ajoutTrajetModal">
            Ajouter un trajet
        </button>
    </div>

    <!-- Modal d’ajout de trajet -->
    <div class="modal fade" id="ajoutTrajetModal" tabindex="-1" aria-labelledby="ajoutTrajetModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="ajoutTrajetModalLabel">Ajouter un trajet</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
          </div>
          <div class="modal-body">
            <form id="trajetForm">
              <div class="mb-3">
                <label for="depart" class="form-label">Départ :</label>
                <input type="text" class="form-control" id="depart" name="depart" placeholder="Départ" required>
              </div>
              <div class="mb-3">
                <label for="arrivee" class="form-label">Arrivée :</label>
                <input type="text" class="form-control" id="arrivee" name="arrivee" placeholder="Arrivée" required>
              </div>
              <div class="row">
                <div class="col mb-3">
                  <label for="date" class="form-label">Date :</label>
                  <input type="date" class="form-control" id="date" name="date" required>
                </div>
                <div class="col mb-3">
                  <label for="heure" class="form-label">Heure :</label>
                  <input type="time" class="form-control" id="heure" name="heure" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="places" class="form-label">Nombre de places :</label>
                <input type="number" class="form-control" id="places" name="places" min="1" required placeholder="Nombre de places">
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Ajouter</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Liste des trajets -->
    <div class="row" id="liste-trajets">
      <!-- Trajets insérés dynamiquement ici -->
    </div>
</div>

<!-- Modal de réservation -->
<div class="modal fade" id="reservationModal" tabindex="-1" aria-labelledby="reservationModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="reservationModalLabel">Réserver ce trajet</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body">
        <div id="modalBody">
          <!-- Infos du trajet sélectionné -->
        </div>
        <div class="mt-3">
          <label for="nbPlaces" class="form-label">Nombre de places à réserver :</label>
          <input type="number" id="nbPlaces" class="form-control" min="1" value="1">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-success" id="btnConfirmerReservation" data-trajet-id="">Confirmer</button>
      </div>
    </div>
  </div>
</div>

<a href="dashboard.html" class="btn bg-warning btn-sm m-2">Dashboard</a>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./asset/JS/Covoiturage.js?v=1.0.4"></script>
</body>
</html>
