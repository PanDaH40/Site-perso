<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Historique des trajets du conducteur</title>
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
  <!-- Icones Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- Ton CSS custom (voir message précédent) -->
  <link rel="stylesheet" href="./asset/CSS/HistoriqueConducteur.css">
  
</head>
<body>
  <div class="container py-4">
    <h2 id="titre-historique" class="mb-4">
      <i class="bi bi-tree-fill me-2 text-success"></i>
      Historique des trajets
    </h2>
    <div id="info-conducteur" class="mb-4"></div>
    <div id="liste-historique"></div>
    <div id="aucun-trajet" class="alert alert-info text-center d-none">
      <i class="bi bi-emoji-frown"></i> Aucun trajet terminé trouvé pour ce conducteur.
    </div>
    <div class="text-center mt-4">
      <a href="javascript:history.back()" class="btn btn-warning px-4">
        <i class="bi bi-arrow-left-circle me-1"></i> Retour au profil
      </a>
    </div>
  </div>
  <script src="./asset/JS/HistoriqueConducteur.js"></script>
</body>
</html>
