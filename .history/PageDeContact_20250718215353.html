<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - EcoRide</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .contact-header { background: url('asset/Images/contact-bg.jpg') center/cover no-repeat; height: 30vh; }
    .contact-header h1 { text-shadow: 0 0 5px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

  <header class="contact-header d-flex justify-content-center align-items-center text-white">
    <h1>Nous contacter</h1>
  </header>

  <main class="container py-5">
    <section aria-labelledby="contact-form-title">
      <h2 id="contact-form-title" class="h3 mb-4">Envoyez-nous un message</h2>
      <form id="contactForm" class="bg-white p-4 rounded shadow-sm" method="POST" action="asset/PHP/send_contact.php">
        <div class="mb-3">
          <label for="contactName" class="form-label">Nom et prénom</label>
          <input type="text" class="form-control" id="contactName" name="name" required>
        </div>
        <div class="mb-3">
          <label for="contactEmail" class="form-label">Adresse email</label>
          <input type="email" class="form-control" id="contactEmail" name="email" required>
        </div>
        <div class="mb-3">
          <label for="contactSubject" class="form-label">Sujet</label>
          <input type="text" class="form-control" id="contactSubject" name="subject" required>
        </div>
        <div class="mb-3">
          <label for="contactMessage" class="form-label">Message</label>
          <textarea class="form-control" id="contactMessage" name="message" rows="5" required></textarea>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" value="" id="contactConsent" name="consent" required>
          <label class="form-check-label" for="contactConsent">
            J'accepte que mes données soient utilisées pour traiter ma demande conformément à la <a href="mentions_legales.html" target="_blank">politique de confidentialité</a>.
          </label>
        </div>
        <button type="submit" class="btn btn-primary">Envoyer</button>
      </form>
    </section>

    <section aria-labelledby="contact-info-title" class="mt-5">
      <h2 id="contact-info-title" class="h4 mb-3">Nos coordonnées</h2>
      <ul class="list-unstyled">
        <li><i class="bi bi-geo-alt-fill me-2"></i>123 rue de la Mobilité, 75000 Paris</li>
        <li><i class="bi bi-telephone-fill me-2"></i><a href="tel:+33123456789">+33 1 23 45 67 89</a></li>
        <li><i class="bi bi-envelope-fill me-2"></i><a href="mailto:contact@ecoride.fr">support@Ecoride.fr</a></li>
      </ul>
    </section>
  </main>

  <footer class="text-center py-4 bg-white border-top">
    <small>&copy; 2025 EcoRide - Tous droits réservés.</small>
  </footer>

  <!-- Bootstrap JS & Icons -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.js"></script>
</body>
</html>
