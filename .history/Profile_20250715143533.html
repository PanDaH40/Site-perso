<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Utilisateur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./asset/CSS/PageProfil.css">
</head>
<body>
  <header class="bg-light py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">Mon Profil</h1>
      <button id="logoutBtn" class="btn btn-outline-dark btn-sm">Déconnexion</button>
    </div>
  </header>

  <main class="container mt-4">
    <div class="row">
      <!-- Formulaire profil -->
      <div class="col-md-6">
        <h2>Mes Informations</h2>
        <form id="profileForm">
          <!-- Choix du rôle -->
          <fieldset class="mb-4">
            <legend>Je suis&nbsp;:</legend>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="roleConducteur" name="roleConducteur">
              <label class="form-check-label" for="roleConducteur">Conducteur</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="rolePassager" name="rolePassager">
              <label class="form-check-label" for="rolePassager">Passager</label>
            </div>
          </fieldset>

          <div class="mb-3">
            <label for="profilePrenom" class="form-label">Prénom</label>
            <input type="text" id="profilePrenom" name="prenom" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="profileNom" class="form-label">Nom</label>
            <input type="text" id="profileNom" name="nom" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="profileEmail" class="form-label">Email</label>
            <input type="email" id="profileEmail" name="email" class="form-control" required>
          </div>

          <!-- Bloc Conducteur -->
          <div id="conducteurFields">
            <h3 class="mt-4">Mon véhicule</h3>
            <div class="mb-3">
              <label for="profileVoiture" class="form-label">Modèle de voiture</label>
              <input type="text" id="profileVoiture" name="voiture" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Type de carburant</label>
              <select id="profileCarburant" name="carburant" class="form-select">
                <option value="electric">Électrique</option>
                <option value="essence">Essence</option>
                <option value="gazole">Gazole</option>
              </select>
            </div>
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="acceptAnimaux" name="animaux">
              <label class="form-check-label" for="acceptAnimaux">Animaux acceptés</label>
            </div>
            <div class="form-check form-switch mb-4">
              <input class="form-check-input" type="checkbox" id="acceptFumeur" name="fumeurs">
              <label class="form-check-label" for="acceptFumeur">Fumeur accepté</label>
            </div>
          </div>

          <!-- Bloc Passager -->
          <div id="passagerFields">
            <h3 class="mt-4">Mes préférences (Passager)</h3>
            <div class="mb-3">
              <label for="profilePreferences" class="form-label">Préférences</label>
              <textarea id="profilePreferences" name="preferences" class="form-control" rows="3"
                        placeholder="Ex: Non fumeur, Animaux interdits..."></textarea>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
        </form>
      </div>

      <!-- Messagerie -->
      <div class="col-md-6">
        <h2>Contacter via message</h2>
        <div class="mb-3">
          <label for="messageDestinataire" class="form-label">Destinataire</label>
          <select id="messageDestinataire" class="form-select">
            <!-- Options chargées dynamiquement -->
          </select>
        </div>
        <div class="mb-3">
          <label for="messageTexte" class="form-label">Message</label>
          <textarea id="messageTexte" class="form-control" rows="4" placeholder="Écrivez votre message..."></textarea>
        </div>
        <button id="sendMessageBtn" class="btn btn-success">Envoyer</button>
        <hr>
        <div id="inbox" class="mt-3">
          <h5>Messages reçus</h5>
          <ul id="messageList" class="list-group">
            <!-- Messages dynamiques -->
          </ul>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./asset/JS/Profile.js"></script>
  <script>./ass</script>
</body>
</html>
