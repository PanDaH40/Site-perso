<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Profil de membre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="./asset/CSS/PageProfilPublic.css" />
</head>
<body>

  <!-- Notification cloche -->
  <a href="Messagerie.html" id="notif-messages" class="position-relative">
    <i class="bi bi-bell"></i>
    <span id="badge-msg" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
  </a>

  <div class="container py-5">
    <div class="card p-4 shadow">

      <div class="d-flex align-items-center mb-3">
        <img id="avatar" src="asset/Images/default_03.png" class="rounded-circle me-3" width="80" height="80" alt="Photo de profil" />
        <div>
          <h2 class="mb-1" id="pseudo">Prénom</h2>
          <span class="badge bg-secondary" id="role"></span>
        </div>
      </div>

      <div class="mb-3">
        <h5>Faites connaissance avec <span id="prenom"></span> :</h5>
        <p id="bio" class="mb-0">Présentation...</p>
      </div>

      <ul class="list-unstyled mb-3" id="infos-plus">
        <!-- préférences, animaux, fumeur, musique, etc -->
      </ul>

      <div class="d-flex flex-wrap gap-3 align-items-center mb-4">
        <div>
          <i class="bi bi-calendar3"></i>
          <span id="anciennete"></span>
        </div>
        <div>
          <i class="bi bi-check2-circle"></i>
          <span id="nbTrajets"></span>
        </div>
      </div>

      <div id="avis-section" class="mb-4"></div>

      <!-- Modal Envoi de message -->

      
<div class="modal fade" id="sendMessageModal" tabindex="-1" aria-labelledby="sendMessageModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form id="sendMessageForm" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="sendMessageModalLabel">Envoyer un message</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body">
        <textarea id="modalMessageText" class="form-control" rows="5" placeholder="Écrivez votre message ici..." required></textarea>
        <div id="modalMessageFeedback" class="mt-2"></div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Envoyer</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
      </div>
    </form>
  </div>
</div>


      <div>
        <a href="PageCovoiturage.html" class="btn btn-outline-primary">Retour aux trajets</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./asset/JS/public_profile.js"></script>
  <script src="./asset/JS/profile_view.js"></script>
</body>
</html>
