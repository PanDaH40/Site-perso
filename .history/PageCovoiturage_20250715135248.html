<!-- Covoiturage.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Covoiturage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="./asset/CSS/PageCovoiturage.css"/>
</head>
<body>
  <header class="bg-light py-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">Covoiturage</h1>
      <div>
        <a href="dashboard.html" class="btn btn-warning btn-sm me-2">Dashboard</a>
        <button id="logoutBtn" class="btn btn-outline-dark btn-sm">Déconnexion</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Recherche de trajet -->
    <div class="card mb-4 p-3">
      <h5>Rechercher un trajet</h5>
      <form id="searchForm" class="row g-2">
        <div class="col-sm"><input id="departure" class="form-control" placeholder="Départ"/></div>
        <div class="col-sm"><input id="arrival" class="form-control" placeholder="Arrivée"/></div>
        <div class="col-sm"><input id="dateSearch" type="date" class="form-control"/></div>
        <div class="col-sm-auto"><input id="passengers" type="number" min="1" class="form-control" placeholder="Passagers"/></div>
        <div class="col-sm-auto"><button type="submit" class="btn btn-warning">Rechercher</button></div>
      </form>
    </div>

    <!-- Ajout trajet -->
    <div class="card mb-4 p-3">
      <h5>Ajouter un trajet</h5>
      <form id="trajetForm" class="row g-2">
        <div class="col-md"><input id="depart" class="form-control" placeholder="Départ" required/></div>
        <div class="col-md"><input id="arrivee" class="form-control" placeholder="Arrivée" required/></div>
        <div class="col-md"><input id="date" type="date" class="form-control" required/></div>
        <div class="col-md"><input id="heure" type="time" class="form-control" required/></div>
        <div class="col-md"><input id="places" type="number" min="1" class="form-control" placeholder="Places" required/></div>
        <div class="col-md"><input id="prix" type="number" step="0.01" min="0" class="form-control" placeholder="Prix (€)" required/></div>
        <div class="col-12"><button type="submit" class="btn btn-primary w-100">Ajouter</button></div>
      </form>
    </div>

    <!-- Liste des trajets -->
    <div class="row" id="liste-trajets"></div>
  </main>

  <!-- Modal Réservation -->
  <div class="modal fade" id="reservationModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Réserver ce trajet</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button class="btn btn-success" id="btnConfirmerReservation">Confirmer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./asset/JS/Covoiturage.js"></script>
</body>
</html>
