<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./asset/CSS/PageCovoiturage.css" />
  <title>Covoiturage</title>
</head>
<body>
<div class="container py-5">
  <p id="userStatus" class="text-end text-muted mb-3"></p>

  <h1 class="text-center mb-4">🚗 Liste des trajets disponibles</h1>

  <!-- Section de recherche -->
  <div class="card p-4 mb-4">
    <h5 class="mb-3">Rechercher un trajet</h5>
    <form id="searchForm">
      <div class="row mb-3">
        <div class="col">
          <input type="text" class="form-control" id="departure" placeholder="Départ">
        </div>
        <div class="col">
          <input type="text" class="form-control" id="arrival" placeholder="Arrivée">
        </div>
        <div class="col">
          <input type="date" class="form-control" id="date">
        </div>
        <div class="col">
          <input type="number" class="form-control" id="passengers" min="1" placeholder="Nombre de passagers">
        </div>
        <div class="col-auto d-flex gap-2">
          <button type="submit" class="btn btn-primary">Rechercher</button>
          <button type="button" id="resetFilters" class="btn btn-secondary">Réinitialiser</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Formulaire d’ajout de trajet -->
  <div id="formAjoutContainer" class="card p-4 mb-5 d-none">
    <h5 class="mb-3">Ajouter un trajet</h5>
    <form id="trajetForm">
      <div class="row mb-3">
        <div class="col">
          <input type="text" class="form-control" id="depart" name="depart" placeholder="Départ" required>
        </div>
        <div class="col">
          <input type="text" class="form-control" id="arrivee" name="arrivee" placeholder="Arrivée" required>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col">
          <input type="date" class="form-control" id="date" name="date" required>
        </div>
        <div class="col">
          <input type="time" class="form-control" id="heure" name="heure" required>
        </div>
        <div class="col">
          <input type="number" class="form-control" id="places" name="places" min="1" required placeholder="Nombre de places">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Ajouter</button>
      <div class="text-end">
        <button type="reset" class="btn btn-outline-secondary mt-2">Réinitialiser</button>
      </div>
    </form>
  </div>

  <!-- Liste des trajets -->
  <div class="row" id="trajetList">
    <!-- Trajets dynamiques -->
  </div>
</div>

<!-- Modal de réservation -->
<div class="modal fade" id="reservationModal" tabindex="-1" aria-labelledby="reservationModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="reservationModalLabel">Réserver ce trajet</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body">
        <div id="modalBody"></div>
        <div class="mt-3">
          <label for="nbPlaces" class="form-label">Nombre de places à réserver :</label>
          <input type="number" id="nbPlaces" class="form-control" min="1" value="1">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-success" onclick="confirmerReservation()">Confirmer</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal d'édition -->
<div class="modal fade" id="editTrajetModal" tabindex="-1" aria-labelledby="editTrajetLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editTrajetForm">
        <div class="modal-header">
          <h5 class="modal-title" id="editTrajetLabel">Modifier le trajet</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="trajetId" name="id" />
          <div class="mb-3">
            <label for="editDate" class="form-label">Date</label>
            <input type="date" class="form-control" id="editDate" name="date" required />
          </div>
          <div class="mb-3">
            <label for="editHeure" class="form-label">Heure</label>
            <input type="time" class="form-control" id="editHeure" name="heure" required />
          </div>
          <div class="mb-3">
            <label for="editDepart" class="form-label">Départ</label>
            <input type="text" class="form-control" id="editDepart" name="depart" required />
          </div>
          <div class="mb-3">
            <label for="editArrivee" class="form-label">Arrivée</label>
            <input type="text" class="form-control" id="editArrivee" name="arrivee" required />
          </div>
          <div class="mb-3">
            <label for="editPlaces" class="form-label">Places disponibles</label>
            <input type="number" class="form-control" id="editPlaces" name="places" min="1" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Enregistrer</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Lien dashboard -->
<a href="dashboard.html" class="btn bg-warning btn-sm m-2">Dashboard</a>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./asset/JS/Covoiturage.js"></script>
</body>
</html>
