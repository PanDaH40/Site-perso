<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Messagerie</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./asset/CSS/Messagerie.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <!-- Notification cloche -->
  <a href="Messagerie.html" id="notif-messages" class="position-relative m-3 d-inline-block">
    <i class="bi bi-bell fs-3"></i>
    <span id="badge-msg" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
  </a>

  <div class="container py-5">
    <h1 class="mb-4">Ma messagerie</h1>
    <div class="row">
      <!-- Liste des conversations -->
      <div class="col-md-4">
        <h5>Conversations</h5>
        <button id="refreshConversations" class="btn btn-outline-secondary btn-sm mb-3 w-100">Actualiser</button>
        <ul id="conversationsList" class="list-group" style="max-height: 500px; overflow-y: auto;">
          <!-- Liste des interlocuteurs chargée dynamiquement -->
        </ul>
      </div>

      <!-- Zone d'échange -->
      <div class="col-md-8 d-flex flex-column">
        <h5>Conversation</h5>
        <div id="messageThread" class="border rounded p-3 flex-grow-1 mb-3" style="overflow-y:auto; background:#fafafa; min-height: 300px;">
          <p class="text-muted">Sélectionnez une conversation à gauche pour commencer.</p>
        </div>
        <div class="input-group">
          <textarea id="messageTexte" class="form-control" rows="2" placeholder="Écrivez votre message..." disabled></textarea>
          <button id="sendMessageBtn" class="btn btn-success" disabled>Envoyer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./asset/JS/messagerie.js"></script>
</body>
</html>
