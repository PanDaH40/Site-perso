<div class="col-md-6">
  <h2>Contacter via message</h2>
  <div class="mb-3">
    <label for="messageDestinataire" class="form-label">Destinataire</label>
    <select id="messageDestinataire" class="form-select">
      <!-- Options chargées dynamiquement -->
    </select>
  </div>
  <div class="mb-3">
    <label for="messageTexte" class="form-label">Message</label>
    <textarea id="messageTexte" class="form-control" rows="4" placeholder="Écrivez votre message..."></textarea>
  </div>
  <button id="sendMessageBtn" class="btn btn-success">Envoyer</button>
  <hr>
  <div id="inbox" class="mt-3">
    <h5>Messages reçus</h5>
    <ul id="messageList" class="list-group">
      <!-- Messages dynamiques -->
    </ul>
  </div>
</div>
