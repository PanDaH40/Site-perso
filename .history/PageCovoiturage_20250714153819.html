<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./asset/CSS/PageCovoiturage.css">
  <title>Covoiturage</title>
</head>
<body>

  <!-- Header Parallax -->
  <header class="parallax text-white text-center d-flex align-items-center justify-content-center" style="height: 40vh;">
    <h1 class="display-4">🚗 EcoRide - Trajets Disponibles</h1>
  </header>

  <main class="container py-5">
    <!-- Search & Add Forms Side-by-Side on lg screens -->
    <div class="row g-4 mb-5">
      <!-- Search Form -->
      <div class="col-12 col-lg-6">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Rechercher un trajet</h5>
            <form id="searchForm" class="row g-2">
              <div class="col-sm-6">
                <input type="text" class="form-control" id="departure" placeholder="Départ">
              </div>
              <div class="col-sm-6">
                <input type="text" class="form-control" id="arrival" placeholder="Arrivée">
              </div>
              <div class="col-sm-6">
                <input type="date" class="form-control" id="dateSearch">
              </div>
              <div class="col-sm-4">
                <input type="number" class="form-control" id="passengers" min="1" placeholder="Passagers">
              </div>
              <div class="col-sm-2 d-grid">
                <button type="submit" class="btn btn-success">Rechercher</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <!-- Add Form -->
      <div class="col-12 col-lg-6">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Ajouter un trajet</h5>
            <form id="trajetForm" class="row g-2">
              <div class="col-md-6">
                <input type="text" class="form-control" id="depart" name="depart" placeholder="Départ" required>
              </div>
              <div class="col-md-6">
                <input type="text" class="form-control" id="arrivee" name="arrivee" placeholder="Arrivée" required>
              </div>
              <div class="col-md-4">
                <input type="date" class="form-control" id="date" name="date" required>
              </div>
              <div class="col-md-4">
                <input type="time" class="form-control" id="heure" name="heure" required>
              </div>
              <div class="col-md-4">
                <input type="number" class="form-control" id="places" name="places" min="1" placeholder="Places" required>
              </div>
              <div class="col-12 d-grid">
                <button type="submit" class="btn btn-primary">Ajouter</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Trajets Cards -->
    <div class="row g-4" id="liste-trajets">
      <!-- Les trajets seront insérés ici en .col-md-4 -->
    </div>
  </main>

  <!-- Reservation Modal -->
  <div class="modal fade" id="reservationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Réserver ce trajet</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modalBody"></div>
          <div class="mt-3">
            <label for="nbPlaces" class="form-label">Nombre de places :</label>
            <input type="number" id="nbPlaces" class="form-control" min="1" value="1">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-success" id="btnConfirmerReservation">Confirmer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dashboard Link -->
  <a href="dashboard.html" class="btn btn-warning btn-sm position-fixed bottom-0 end-0 m-3">Dashboard</a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./asset/JS/Covoiturage.js"></script>
</body>
</html>
