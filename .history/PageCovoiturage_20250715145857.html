        <h5 class="mb-3">Rechercher un trajet</h5>

            <div class="col"><input type="text" class="form-control" id="departure" placeholder="Départ"></div>
            <div class="col"><input type="text" class="form-control" id="arrival"  placeholder="Arrivée"></div>
            <div class="col"><input type="date" class="form-control" id="dateSearch"></div>

            <div class="col-auto"><button type="submit" class="btn bg-warning">Rechercher</button></div>
          </div>
        </form>
      </div>
