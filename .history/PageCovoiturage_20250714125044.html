<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Covoiturage</title>"></a>
  <link rel="stylesheet" href="./asset/CSS/PageCovoiturage.css">
  <script src="asset/JS/Covoiturage.js" defer></script>
</head>
<body>

  <h1>Ajouter un trajet</h1>
  <form id="form-trajet">
    <label for="destination">Destination :</label>
    <input type="text" id="destination" required />

    <label for="heure">Heure :</label>
    <input type="time" id="heure" required />

    <label for="places">Nombre de places :</label>
    <input type="number" id="places" min="1" required />

    <button type="submit">Ajouter</button>
  </form>

  <h2>Trajets disponibles</h2>
  <table border="1">
    <thead>
      <tr>
        <th>Destination</th>
        <th>Heure</th>
        <th>Places</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="liste-trajets">
      <!-- Trajets ajoutés dynamiquement ici -->
    </tbody>
  </table>

</body>
</html>
