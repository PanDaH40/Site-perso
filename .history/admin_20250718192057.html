<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Gestion des membres & Problèmes signalés</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
</head>
<body>
  <nav class="navbar navbar mb-4 bg-success text-white">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1"><i class="bi bi-shield-lock"></i> Administration du site</span>
      <a href="PageCovoiturage.html" class="btn btn-outline-light">Retour au site</a>
    </div>
  </nav>
  <div class="container">
    <h2 class="mb-4"><i class="bi bi-people"></i> Membres</h2>
    <div class="row mb-3">
      <div class="col-md-4">
        <input id="search-user" class="form-control" placeholder="Recherche (nom, prénom, email)">
      </div>
      <div class="col-md-3">
        <select id="role-filter" class="form-select">
          <option value="">Tous les rôles</option>
          <option value="conducteur">Conducteurs</option>
          <option value="passager">Passagers</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="statut-filter" class="form-select">
          <option value="">Tous statuts</option>
          <option value="actif">Actifs</option>
          <option value="suspendu">Suspendus</option>
        </select>
      </div>
    </div>

    <div class="table-responsive mb-5">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-success">
          <tr>
            <th>ID</th>
            <th>Prénom</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Rôles</th>
            <th>Statut</th>
            <th>Jetons</th>
            <th>Admin</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>

    <div id="admin-feedback" class="mt-2"></div>

    <!-- NOUVELLE SECTION : Problèmes signalés -->
    <h2 class="mb-4"><i class="bi bi-exclamation-triangle-fill text-warning"></i> Problèmes signalés</h2>
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-warning">
          <tr>
            <th>ID Signalement</th>
            <th>Signalé par</th>
            <th>Type</th>
            <th>Motif</th>
            <th>Description</th>
            <th>Date du signalement</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="signalements-tbody">
          <!-- Chargé dynamiquement via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./asset/JS/admin.js"></script>
