<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <title>Dashboard Covoiturage</title>
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">Dashboard</h1>
    <p id="userStatus" class="fw-bold"></p>

    <!-- Trajets proposés -->
    <section class="mb-5">
      <h2>Mes trajets proposés</h2>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Date & Heure</th>
            <th>Départ</th>
            <th>Arrivée</th>
            <th>Places</th>
            <th>Prix (€)</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="trajets-proposes"></tbody>
      </table>
    </section>

    <!-- Trajets réservés -->
    <section class="mb-5">
      <h2>Mes trajets réservés</h2>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Date & Heure</th>
            <th>Départ</th>
            <th>Arrivée</th>
            <th>Conducteur</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="trajets-reserves"></tbody>
      </table>
    </section>

    <!-- Modal de modification -->
    <div class="modal fade" id="editTrajetModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editTrajetForm">
            <div class="modal-header">
              <h5 class="modal-title">Modifier trajet</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" name="id" id="trajetId" />
              <div class="mb-3">
                <label for="editDate" class="form-label">Date</label>
                <input type="date" class="form-control" name="date" id="editDate" required />
              </div>
              <div class="mb-3">
                <label for="editHeure" class="form-label">Heure</label>
                <input type="time" class="form-control" name="heure" id="editHeure" required />
              </div>
              <div class="mb-3">
                <label for="editDepart" class="form-label">Départ</label>
                <input type="text" class="form-control" name="depart" id="editDepart" required />
              </div>
              <div class="mb-3">
                <label for="editArrivee" class="form-label">Arrivée</label>
                <input type="text" class="form-control" name="arrivee" id="editArrivee" required />
              </div>
              <div class="mb-3">
                <label for="editPlaces" class="form-label">Nombre de places</label>
                <input type="number" class="form-control" name="places" id="editPlaces" min="1" required />
              </div>
              <div class="mb-3">
                <label for="editPrix" class="form-label">Prix (€)</label>
                <input type="number" class="form-control" name="prix" id="editPrix" min="0" step="0.01" required />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
              <button type="submit" class="btn btn-primary">Enregistrer</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./asset/JS/dashboard.js"></script>
  <script src="./asset/JS/logout.js"></script>
  <script src="./asset/JS/messaging.js"></script>
</body>
</html>
