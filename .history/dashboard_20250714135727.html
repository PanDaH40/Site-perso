<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Covoiturage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <h1 class="mb-4">Dashboard</h1>
  <div id="userStatus" class="mb-3 text-info"></div>

  <h2>Trajets Proposés</h2>
  <table id="trajets-proposes" class="table table-striped">
    <thead>
      <tr>
        <th>Date et Heure</th>
        <th>Départ</th>
        <th>Arrivée</th>
        <th>Places</th>
        <th>Statut</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Trajets Réservés</h2>
  <table id="trajets-reserves" class="table table-striped">
    <thead>
      <tr>
        <th>Date et Heure</th>
        <th>Départ</th>
        <th>Arrivée</th>
        <th>Conducteur</th>
        <th>Statut</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Modal Édition -->
  <div class="modal fade" id="editTrajetModal" tabindex="-1" aria-labelledby="editTrajetLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editTrajetLabel">Modifier le trajet</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="editTrajetForm">
          <div class="modal-body">
            <input type="hidden" name="trajetId" />
            <div class="mb-3">
              <label class="form-label">Date</label>
              <input type="date" name="editDate" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Heure</label>
              <input type="time" name="editHeure" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Départ</label>
              <input type="text" name="editDepart" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Arrivée</label>
              <input type="text" name="editArrivee" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Places</label>
              <input type="number" name="editPlaces" class="form-control" min="1" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
