<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription - EcoRide</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Ton CSS -->
  <link rel="stylesheet" href="./asset/CSS/PageInscription.css">
</head>
<body>

  <!-- Bandeau titre -->
  <div class="parallax position-relative d-flex flex-column justify-content-center align-items-center text-white" style="height: 30vh;">
    <h1 class="titre text-center">EcoRide - Inscription</h1>
  </div>

  <!-- Formulaire -->
  <div class="container d-flex align-items-center" style="height: 70vh;">
    <div class="row w-100 justify-content-center">
      <div class="col-md-6">
        <form id="inscriptionForm" class="border p-4 bg-light shadow rounded">

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="nom" class="form-label">Nom</label>
              <input type="text" class="form-control" id="nom" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="prenom" class="form-label">Prénom</label>
              <input type="text" class="form-control" id="prenom" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="age" class="form-label">Âge</label>
            <input type="number" class="form-control" id="age" min="16" required />
          </div>

          <div class="mb-3">
            <label for="telephone" class="form-label">Téléphone</label>
            <input type="tel" class="form-control" id="telephone" required />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Adresse Email</label>
            <input type="email" class="form-control" id="email" required />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="password" required />
          </div>

          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="acceptTerms" required />
            <label class="form-check-label" for="acceptTerms">
              J'accepte les termes et conditions
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100">S'inscrire</button>

          <a href="PageConnection.html" class="btn btn-outline-secondary mt-3 w-100">Déjà inscrit ? Se connecter</a>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Ton JS -->
  <script src="./asset/JS/Inscription.js"></script>
</body>
</html>
