<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Test Inscription</title>
</head>
<body>
  <h2>Test d'inscription</h2>
  <form id="form">
    <input type="text" name="nom" placeholder="Nom" required><br>
    <input type="text" name="prenom" placeholder="Prénom" required><br>
    <input type="number" name="age" placeholder="Âge" required><br>
    <input type="text" name="telephone" placeholder="Téléphone" required><br>
    <input type="email" name="email" placeholder="Email" required><br>
    <input type="password" name="password" placeholder="Mot de passe" required><br>
    <button type="submit">S'inscriire</button>
  </form>

  <pre id="output"></pre>

  <script>
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();

      const formData = new FormData(this);

      fetch("./asset/PHP/inscription.php", {
        method: "POST",
        body: formData
      })
        .then(response => response.text())  // Important pour voir la vraie sortie
        .then(data => {
          document.getElementById("output").textContent = data;
          try {
            const json = JSON.parse(data);
            alert(json.message);
          } catch (e) {
            alert("Réponse non JSON : " + data);
          }
        })
        .catch(error => {
          console.error("Erreur fetch:", error);
        });
    });
  </script>
</body>
</html>
