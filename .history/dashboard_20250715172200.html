<main class="container my-5">

  <!-- Mes trajets proposés -->
  <section class="mb-5">
    <div class="card shadow-lg border-0">
      <div class="card-header bg-primary text-white d-flex align-items-center">
        <i class="bi bi-steering-wheel me-2"></i>
        <h2 class="h5 mb-0">Mes trajets proposés</h2>
      </div>
      <div class="card-body bg-light">
        <div class="table-responsive">
          <table id="trajets-proposes" class="table align-middle table-hover mb-0">
            <caption class="visually-hidden">Liste des trajets que vous proposez</caption>
            <thead>
              <tr>
                <th>Date & Heure</th>
                <th>Départ</th>
                <th>Arrivée</th>
                <th>Places</th>
                <th>Prix (€)</th>
                <th>Statut</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- Mes trajets réservés -->
  <section class="mb-5">
    <div class="card shadow-lg border-0">
      <div class="card-header bg-success text-white d-flex align-items-center">
        <i class="bi bi-person-check me-2"></i>
        <h2 class="h5 mb-0">Mes trajets réservés</h2>
      </div>
      <div class="card-body bg-light">
        <div class="table-responsive">
          <table id="trajets-reserves" class="table align-middle table-hover mb-0">
            <caption class="visually-hidden">Liste des trajets réservés</caption>
            <thead>
              <tr>
                <th>Date & Heure</th>
                <th>Départ</th>
                <th>Arrivée</th>
                <th>Conducteur</th>
                <th>Statut</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</main>
