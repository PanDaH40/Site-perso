<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Réinitialisation du mot de passe</title>
</head>
<body>
  <h2>Réinitialisation du mot de passe</h2>
  <form id="resetForm">
    <input type="hidden" id="token" value="">
    <label>Nouveau mot de passe :</label><br>
    <input type="password" id="new-password" required minlength="6"><br><br>
    <button type="submit">Changer mon mot de passe</button>
  </form>
  <div id="feedback"></div>
  <script>
    // Récupère le token dans l'URL
    document.getElementById("token").value = new URLSearchParams(window.location.search).get("token") || "";

    document.getElementById("resetForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const token = document.getElementById("token").value;
      const password = document.getElementById("new-password").value;

      fetch("asset/PHP/reset_password.php", {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ token, password })
      })
      .then(r => r.json())
      .then(data => {
        document.getElementById("feedback").textContent = data.success
          ? "Votre mot de passe a été réinitialisé !"
          : (data.error || "Erreur.");
      });
    });
  </script>
</body>
</html>
