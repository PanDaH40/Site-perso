<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./asset/CSS/PageDashbord.css">
</head>
<body>
  <header class="bg-light py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <h1 class="h4 mb-1">Tableau de bord Covoiturage</h1>
        <p id="userStatus" class="text-info mb-0"></p>
      </div>
      <div>
        <a href="PageDaccueil.html" class="btn btn-warning btn-sm me-2">Accueil</a>
        <a href="PageCovoiturage.html" class="btn btn-warning btn-sm me-2">Liste de Covoiturage</a>
        <button id="logoutBtn" class="btn btn-outline-dark btn-sm">Déconnexion</button>
      </div>
    </div>
  </header>

  <main class="container mt-4">
    <!-- Mes trajets proposés -->
    <section class="mb-5">
      <h2>Mes trajets proposés</h2>
      <table id="trajets-proposes" class="table table-striped">
        <caption>Liste des trajets que vous proposez</caption>
        <thead>
          <tr>
            <th>Date & Heure</th>
            <th>Départ</th>
            <th>Arrivée</th>
            <th>Places</th>
            <th>Prix (€)</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Mes trajets réservés -->
    <section class="mb-5">
      <h2>Mes trajets réservés</h2>
      <table id="trajets-reserves" class="table table-striped">
        <caption>Liste des trajets réservés</caption>
        <thead>
          <tr>
            <th>Date & Heure</th>
            <th>Départ</th>
            <th>Arrivée</th>
            <th>Conducteur</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

  <!-- Modal de modification de trajet -->
  <div class="modal fade" id="editTrajetModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="editTrajetForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Modifier le trajet</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="trajetId" name="id">
          <div class="mb-3">
            <label for="editDate" class="form-label">Date</label>
            <input type="date" class="form-control" id="editDate" name="date" required>
          </div>
          <div class="mb-3">
            <label for="editHeure" class="form-label">Heure</label>
            <input type="time" class="form-control" id="editHeure" name="heure" required>
          </div>
          <div class="mb-3">
            <label for="editDepart" class="form-label">Départ</label>
            <input type="text" class="form-control" id="editDepart" name="depart" required>
          </div>
          <div class="mb-3">
            <label for="editArrivee" class="form-label">Arrivée</label>
            <input type="text" class="form-control" id="editArrivee" name="arrivee" required>
          </div>
          <div class="mb-3">
            <label for="editPlaces" class="form-label">Places</label>
            <input type="number" class="form-control" id="editPlaces" name="places" min="1" required>
          </div>
          <div class="mb-3">
            <label for="editPrix" class="form-label">Prix (€)</label>
            <input type="number" class="form-control" id="editPrix" name="prix" min="0" step="0.01" required>
          </div>
        </div>
        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-danger" data-action="delete">Supprimer</button>
          <div>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <footer class="bg-light text-center py-3">
    <button id="logoutBtn" class="btn btn-outline-dark">Déconnexion</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./asset/JS/dashboard.js"></script>
  <script src="./asset/JS/logout.js"></script>
</body>
</html>
