<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Historique des trajets du conducteur</title>
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
  <!-- Icones Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- Ton CSS custom (voir message précédent) -->
  <link rel="stylesheet" href="./asset/CSS/HistoriqueConducteur.css">
  <style>
    body {
      background: linear-gradient(135deg, #e3f9e5 0%, #c6ecc6 100%);
      min-height: 100vh;
    }
    .trajet-card {
      border-radius: 1.25rem;
      border: none;
      box-shadow: 0 2px 12px rgba(50,150,50,0.08);
      transition: box-shadow .2s;
      background: #f5fff4;
    }
    .trajet-card:hover {
      box-shadow: 0 6px 30px rgba(45,185,74,0.17);
    }
    #titre-historique {
      color: #37a846;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: .5px;
      text-align: center;
    }
    .btn-warning {
      color: #16681c;
      font-weight: 600;
    }
    #info-conducteur img {
      border: 2.5px solid #6bbd77;
      box-shadow: 0 1px 6px rgba(60,130,80,0.08);
    }
    .alert-info {
      background: #f6fff1;
      border-color: #bee2b8;
      color: #3b7b31;
    }
    @media (max-width: 767.98px) {
      .card.trajet-card { width: 100%; }
    }
    @media (min-width: 768px) {
      .card.trajet-card { width: 80%; min-width: 340px; margin-left:auto; margin-right:auto; }
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <h2 id="titre-historique" class="mb-4">
      <i class="bi bi-tree-fill me-2 text-success"></i>
      Historique des trajets
    </h2>
    <div id="info-conducteur" class="mb-4"></div>
    <div id="liste-historique"></div>
    <div id="aucun-trajet" class="alert alert-info text-center d-none">
      <i class="bi bi-emoji-frown"></i> Aucun trajet terminé trouvé pour ce conducteur.
    </div>
    <div class="text-center mt-4">
      <a href="javascript:history.back()" class="btn btn-warning px-4">
        <i class="bi bi-arrow-left-circle me-1"></i> Retour au profil
      </a>
    </div>
  </div>
  <script src="./asset/JS/HistoriqueConducteur.js"></script>
</body>
</html>
