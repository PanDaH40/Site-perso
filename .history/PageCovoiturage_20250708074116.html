<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./asset/CSS/PageCovoiturage.css">
    <title>Covoiturage</title>
</head>
<body>
    
    <div class="container py-5">
        <h1 class="text-center mb-4">🚗 Liste des trajets disponibles</h1>
    
        <!-- Section d’ajout de trajet -->
        <div id="formAjoutContainer" class="card p-4 mb-5 d-none">
          <h5 class="mb-3">Ajouter un trajet</h5>
          <form id="trajetForm">
            <div class="row mb-3">
              <div class="col">
                <input type="text" class="form-control" id="depart" placeholder="Départ" required>
              </div>
              <div class="col">
                <input type="text" class="form-control" id="arrivee" placeholder="Arrivée" required>
              </div>
            </div>
            <input type="text" class="form-control mb-3" id="conducteur" placeholder="Nom du conducteur" required>
            <div class="row mb-3">
              <div class="col">
                <input type="date" class="form-control" id="date" required>
              </div>
              <div class="col">
                <input type="time" class="form-control" id="heure" required>
              </div>
            </div>
            <input type="number" class="form-control mb-3" id="places" placeholder="Nombre de places" required>
            <button type="submit" class="btn btn-primary w-100">Ajouter</button>
          </form>
        </div>
    
        <!-- Liste des trajets -->
        <div class="row" id="trajetList">
          <!-- Trajets insérés dynamiquement ici -->
        </div>
      </div>
    
      <!-- Modal de réservation -->

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-success" onclick="confirmerReservation()">Confirmer</button>
        </div>
      </div>
    </div>
  </div>
  
  <a href="dashboard.html" class="btn bg-warning btn-sm m-2">
                Dashboard
            </a>
    
      <!-- Scripts -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <script src="./asset/JS/Covoiturage.js"></script>
      
</body>
</html>
